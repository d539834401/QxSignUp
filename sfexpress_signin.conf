^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/share\/(?:weChat\/shareGiftReceiveRedirect|app\/shareRedirect)\?[^#\\\s\x00-\x1f\x7f]+$ url script-request-header https://raw.githubusercontent.com/d539834401/QxSignUp/master/sfexpress_signin.js?v=20261116.1


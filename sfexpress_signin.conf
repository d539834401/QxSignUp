# 顺丰速运 App / 微信小程序每日签到（QuanX，待实机验证）
# 合并三段到现有配置，追加 hostname；开启重写、MitM 并安装信任证书。
# 登录顺丰 App 或微信「顺丰速运」小程序，进入“我的 → 积分/签到”。
# 收到“参数获取成功”通知后关闭抓取规则，保留定时任务并手动运行验证。
# App 与小程序任选一个抓取；切换账号或会话失效后重新进入页面抓取。

[rewrite_local]
^https:\/\/mcs-mimp-web\.sf-express\.com\/mcs-mimp\/(?:ifLogin|commonPost\/~memberNonactivity~(?:integralSignV2Service~(?:getTodaySign|sign)|integralTaskSignPlusService~(?:automaticSignFetchPackage|getUnFetchPointAndDiscount)|integralTaskStrategyService~queryPointTaskAndSignFromES)|commonPost\/~memberIntegral~userInfoService~(?:queryUserInfo|personalInfoNew))(?:\?[^#\s]*)?$ url script-request-header https://raw.githubusercontent.com/d539834401/QxSignUp/master/sfexpress_signin.js

[task_local]
35 8 * * * https://raw.githubusercontent.com/d539834401/QxSignUp/master/sfexpress_signin.js, tag=顺丰速运签到, enabled=true

[mitm]
hostname = %APPEND% mcs-mimp-web.sf-express.com

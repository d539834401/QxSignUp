# 小黑盒每日签到（Quantumult X，iOS 单账号，待实机验证）
# 将下面三段合并到现有配置，不要重复创建同名段落；hostname 追加至现有列表。
# 开启重写和 MitM，安装并信任证书，打开小黑盒 App“我的 → 签到”。
# 收到“参数获取成功”后关闭下面的抓取规则，保留定时任务，先手动运行验证。
# 使用 main 主分支脚本；脚本只使用本机凭据和本地签名。
# 只有当日签到流水确认入账才通知“签到成功”；其余结果请按通知核对 App。

[rewrite_local]
^https:\/\/api\.xiaoheihe\.cn\/task\/(?:sign_list|list_v2|sign_v[34]\/get_sign_state)\/?(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/d539834401/QxSignUp/main/heybox_signin.js

[task_local]
20 8 * * * https://raw.githubusercontent.com/d539834401/QxSignUp/main/heybox_signin.js, tag=小黑盒签到, enabled=true

[mitm]
hostname = %APPEND% api.xiaoheihe.cn

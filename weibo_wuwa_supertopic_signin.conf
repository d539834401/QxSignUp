# 微博 App · 超话每日签到（Quantumult X）
#
# 将下面三段合并到正在使用的 Quantumult X 配置文件。
# 开启重写后，在微博 App 中依次进入“我的 → 超话社区 → 我的 → 关注”，
# 再进入任意超话手动签到一次；收到两条抓取成功通知后关闭重写。

[rewrite_local]
^https:\/\/api\.weibo\.cn\/2\/(statuses\/container_timeline_topicsub|page\/button) url script-request-body https://raw.githubusercontent.com/d539834401/QxSignUp/main/weibo_wuwa_supertopic_cookie.js

[task_local]
0 8 * * * https://raw.githubusercontent.com/d539834401/QxSignUp/main/weibo_wuwa_supertopic_signin.js, tag=微博·超话签到, enabled=true

[mitm]
hostname = %APPEND% api.weibo.cn

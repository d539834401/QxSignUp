# 中国移动全国版 App「签到有礼」（Quantumult X，待实机验证）
# 版本 20261106.2；引用 master 分支，升级时请替换旧规则及任务地址。
# 合并下面三段到现有配置，不要重复创建段落或覆盖原有 hostname。
# 开启抓取规则和 MitM，完全关闭并重新打开中国移动 App。
# 冷启动模板字段齐全时即可直接运行，不再要求签到页重新触发登录请求。
# 已保存旧版冷启动参数的用户可先更新脚本并直接运行，任务会自动兼容旧数据。
# 收到“参数获取完整”通知后关闭抓取规则，保留定时任务并手动运行验证。
# 必须使用 script-request-body；只抓请求头无法取得登录和会话恢复参数。

[rewrite_local]
^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/LN\/(?:uamonekeylogin|uamrandcodelogin)\/autoLogin(?:\?[^#\s]*)?$ url script-request-body https://raw.githubusercontent.com/d539834401/QxSignUp/master/cmcc_signin.js?v=20261106.2
^https:\/\/wx\.10086\.cn\/qwhdsso\/appTokenLogin(?:\?[^#\s]*)?$ url script-request-body https://raw.githubusercontent.com/d539834401/QxSignUp/master/cmcc_signin.js?v=20261106.2

[task_local]

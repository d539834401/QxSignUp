# 中国移动全国版 App「签到有礼」（Quantumult X，待实机验证）
# 脚本地址指向本仓库 main 分支，可直接使用远程脚本。
# 合并下面三段到现有配置，不要重复创建段落或覆盖原有 hostname。
# 开启两条抓取规则和 MitM，完全关闭并重新打开中国移动 App，再进入「签到有礼」。
# 收到“参数获取完整”通知后关闭两条抓取规则，保留定时任务并手动运行验证。
# 必须使用 script-request-body；只抓请求头无法取得登录和会话恢复参数。

[rewrite_local]
^https:\/\/client\.app\.coc\.10086\.cn\/biz-orange\/LN\/(?:uamonekeylogin|uamrandcodelogin)\/autoLogin$ url script-request-body https://raw.githubusercontent.com/d539834401/QxSignUp/main/cmcc_signin.js
^https:\/\/wx\.10086\.cn\/qwhdsso\/appTokenLogin\?sid=[^&#\s]+$ url script-request-body https://raw.githubusercontent.com/d539834401/QxSignUp/main/cmcc_signin.js

[task_local]
23 8 * * * https://raw.githubusercontent.com/d539834401/QxSignUp/main/cmcc_signin.js, tag=中国移动签到, enabled=true

[mitm]
hostname = %APPEND% client.app.coc.10086.cn wx.10086.cn
